# Downloads the official Pyodide core release into pyodide/ and commits it.
# Run it once from the GitHub app/website: Actions > "Fetch Pyodide" > Run workflow.
name: Fetch Pyodide
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pyodide release to pin"
        default: "0.27.2"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official release
        run: |
          set -e
          V="${{ inputs.version }}"
          curl -fL "https://github.com/pyodide/pyodide/releases/download/${V}/pyodide-core-${V}.tar.bz2" -o core.tar.bz2
          rm -rf pyodide && mkdir pyodide
          tar -xjf core.tar.bz2 -C . 
          rm core.tar.bz2
          echo "${V}" > pyodide/VERSION
          ls -la pyodide
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A pyodide
          git commit -m "Pin Pyodide ${{ inputs.version }}" || echo "nothing to commit"
          git push
